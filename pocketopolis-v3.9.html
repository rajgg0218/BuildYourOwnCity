<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocketopolis — admin test build v3.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --f-display:'Fredoka','Trebuchet MS','Segoe UI Rounded',system-ui,sans-serif;
  --f-body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --sea:#0d4259;
  --ink:#12314a; --ink2:#4f6c84;
  --panel:rgba(255,255,255,.93); --panel2:#eaf2f8; --line:rgba(18,49,74,.16);
  --blue:#2569d6; --blue-ink:#ffffff; --mint:#0e9f6e; --gold:#b87900; --coral:#d8403d;
  --zr:#2fae4a; --zc:#2a7fd8; --zi:#d9970a;
  --shadow:0 8px 22px rgba(3,20,32,.30);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8f4fc; --ink2:#9db9cd;
    --panel:rgba(13,32,47,.92); --panel2:#173247; --line:rgba(255,255,255,.14);
    --blue:#5aa2ff; --blue-ink:#07213d; --mint:#37d49c; --gold:#ffcf4d; --coral:#ff7b78;
    --zr:#5fd37a; --zc:#6bb4ff; --zi:#ffc94d;
  }
}
:root[data-theme="dark"]{
  --ink:#e8f4fc; --ink2:#9db9cd;
  --panel:rgba(13,32,47,.92); --panel2:#173247; --line:rgba(255,255,255,.14);
  --blue:#5aa2ff; --blue-ink:#07213d; --mint:#37d49c; --gold:#ffcf4d; --coral:#ff7b78;
  --zr:#5fd37a; --zc:#6bb4ff; --zi:#ffc94d;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;background:var(--sea);color:var(--ink);
  font:600 14px/1.35 var(--f-body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);
  box-shadow:0 2px 14px rgba(0,0,0,.28);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:30px;height:30px;flex:none}
#cityName{font:600 18px var(--f-display);color:var(--ink);background:transparent;border:0;border-bottom:2px dashed transparent;
  width:170px;padding:2px 2px;border-radius:4px;user-select:text;-webkit-user-select:text}
#cityName:hover{border-bottom-color:var(--line)}
#cityName:focus{border-bottom-color:var(--blue);outline:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);font:600 15px var(--f-display);white-space:nowrap}
.chip b{font-weight:600}
.chip small{font:700 12px var(--f-body);color:var(--ink2)}
.chip.money{cursor:pointer}
.chip.money b{color:var(--gold)}
.chip.money:hover{border-color:var(--blue)}
.pos{color:var(--mint)!important}.neg{color:var(--coral)!important}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{min-width:36px;height:32px;border-radius:999px;font:600 14px var(--f-display);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:18px}
.iconbtn:hover{border-color:var(--blue)}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cv.pan{cursor:grab}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#demand{left:10px;top:10px;padding:8px 10px 6px;display:flex;gap:9px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 13px var(--f-display)}
.dtrack{position:relative;width:14px;height:54px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.dtrack::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink2);opacity:.5}
.dfill{position:absolute;left:0;right:0;height:0}
#advisor{right:10px;top:10px;max-width:310px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
#advisor .av{font-size:26px;line-height:1}
#advisor p{margin:0;font-size:13px;font-weight:700}
#advisor small{display:block;color:var(--ink2);font:600 11px var(--f-body);margin-bottom:2px}
#inspect{left:10px;bottom:10px;width:262px;padding:12px 14px}
#inspect h3{margin:0 0 4px;font:600 17px var(--f-display)}
#inspect dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
#inspect dt{color:var(--ink2)}#inspect dd{margin:0;font-weight:700}
#inspect .quote{margin:8px 0 0;font-style:italic;color:var(--ink2);font-size:12.5px}
#inspect .x{position:absolute;right:8px;top:6px;font-size:16px;color:var(--ink2);width:26px;height:26px;border-radius:8px}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:700;font-size:13px;max-width:calc(100% - 20px);text-align:center;pointer-events:none}
#news{bottom:12px}
#toast{top:76px;background:var(--coral);color:#fff;border-color:transparent}
#tip{position:absolute;pointer-events:none;background:rgba(10,24,36,.92);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:3}

/* ---------- dock ---------- */
#dock{background:var(--panel);box-shadow:0 -2px 14px rgba(0,0,0,.28);padding:6px 8px 8px;z-index:5}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px}
.dockrow{display:flex;align-items:center;gap:4px}
#tabs,#tools{flex:1;min-width:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior-x:contain}
#tabs::-webkit-scrollbar,#tools::-webkit-scrollbar{height:6px}
#tabs::-webkit-scrollbar-thumb,#tools::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.scrollbtn{flex:none;width:28px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:600 20px/1 var(--f-display);display:none}
.scrollbtn.on{display:block}.scrollbtn:hover:not(:disabled){border-color:var(--blue)}.scrollbtn:disabled{opacity:.35;cursor:default}
.dockToggle{flex:none;height:32px;padding:0 12px;margin-bottom:6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font:500 13px var(--f-display);white-space:nowrap}
.dockToggle:hover{border-color:var(--blue)}
@media (min-width:701px){#dock.open #tabs{flex-wrap:wrap;overflow:visible}#dock.open .scrollbtn[data-scroll="tabs"]{display:none!important}}
#dock.open #tools{flex-wrap:wrap;max-height:44vh;overflow-x:hidden;overflow-y:auto}
#dock.open .scrollbtn[data-scroll="tools"]{display:none!important}
.tab{flex:none;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font:500 14px var(--f-display);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--blue);color:var(--blue-ink);border-color:transparent}
#tools{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 4px}
.tool{position:relative;flex:none;width:80px;padding:5px 3px 6px;border-radius:14px;border:2px solid transparent;background:var(--panel2);
  display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.tool:hover{border-color:var(--line)}
.tool.on{border-color:var(--blue);background:var(--panel);box-shadow:0 4px 12px rgba(0,0,0,.18);transform:translateY(-2px)}
.tool .nm{font:700 11.5px/1.1 var(--f-body);min-height:26px;display:flex;align-items:center;justify-content:center}
.tool .ct{font:500 12px var(--f-display);color:var(--ink2)}
.tool.locked{opacity:.55}
.tool.locked::after{content:"🔒";position:absolute;top:3px;right:4px;font-size:12px}
.icon{width:48px;height:48px;display:block}
.emo{width:48px;height:48px;display:grid;place-items:center;font-size:29px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(5,18,28,.62);z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel-solid,var(--panel2));color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  width:min(460px,100%);max-height:100%;overflow:auto;padding:18px 20px;-webkit-user-select:text;user-select:text}
.sheet h2{margin:0 0 10px;font:600 22px var(--f-display)}
.sheet h4{margin:14px 0 6px;font:600 15px var(--f-display)}
.sheet p,.sheet li{font-size:13.5px;margin:4px 0}
.sheet ul{padding-left:18px;margin:6px 0}
.sheet .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sheet .row b{font-family:var(--f-display);font-weight:600}
.menu{display:grid;gap:8px}
.btn{padding:11px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:600 15px var(--f-display);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:transparent}
.btn.danger{color:var(--coral)}
.btn:disabled{opacity:.45;cursor:default}
.btn em{font:600 12.5px var(--f-body);font-style:normal;color:var(--ink2)}
.btn.primary em{color:inherit;opacity:.85}
input[type=range]{width:100%;accent-color:var(--blue)}
.hint{color:var(--ink2);font-size:12.5px}
kbd{font:700 11.5px var(--f-body);background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

/* ---------- admin gate ---------- */
#gate{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(1100px 560px at 50% -8%,#237a9b 0%,rgba(35,122,155,0) 62%),
    repeating-linear-gradient(30deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(150deg,rgba(255,255,255,.035) 0 1px,transparent 1px 46px),#08283a;color:#eaf5fb}
#gate[hidden]{display:none}
.gate-card{margin:auto 0;width:min(380px,100%);background:rgba(8,32,48,.82);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:28px 26px 22px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);text-align:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gate-logo{width:54px;height:54px}
.gate-card h1{margin:8px 0 0;font:600 32px var(--f-display);letter-spacing:.2px}
.gate-sub{margin:2px 0 18px;color:#9fc3d6;font-size:14px}
.gate-card label{display:block;text-align:left;font:600 13px var(--f-body);color:#b9d6e6;margin-bottom:6px}
.gate-card input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;
  font:600 17px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px;-webkit-user-select:text;user-select:text}
.gate-card input::placeholder{color:rgba(255,255,255,.3)}
.gate-card input:focus{outline:3px solid #7cc4ff;outline-offset:1px;border-color:transparent}
.gate-btn{margin-top:14px;width:100%;padding:12px;border-radius:12px;background:#3d8bff;color:#06182b;font:600 17px var(--f-display)}
.gate-btn:hover{background:#6aa8ff}.gate-btn:disabled{opacity:.6;cursor:default}
#gateMsg{min-height:20px;margin:12px 0 0;color:#ffb4a8;font-size:13.5px}
.gate-note{margin:6px 0 0;color:#7fa3b8;font-size:12.5px}

/* ---------- admin tools ---------- */
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.agrid .btn{justify-content:center;text-align:center;font-size:14px;padding:9px 10px}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.sheet select,.sheet textarea{width:100%;font:600 14px var(--f-body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.sheet textarea{margin-top:8px;font:500 12px ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.sheet label.hint{display:block;margin-bottom:4px}
#dbg{left:10px;top:104px;padding:6px 10px;font:600 11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre;pointer-events:none;max-width:calc(100% - 20px)}
#chipDate b{font-variant-numeric:tabular-nums}
#chipDate #skyIco{font-size:16px;line-height:1}

#zoomCtl{right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px}
#zoomCtl button{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:600 20px/1 var(--f-display)}
#zoomCtl button:hover{border-color:var(--blue)}
#zoomPct{font:600 12px var(--f-display);color:var(--ink2);min-width:38px;text-align:center}

#paused{top:12px;background:var(--blue);color:var(--blue-ink);border-color:transparent;pointer-events:auto;cursor:pointer;z-index:4}

@media (max-width:700px){
  #top{gap:6px;padding:6px 8px}
  #cityName{width:112px;font-size:16px}
  .chip{padding:5px 10px;font-size:14px}
  #dateLong{display:none}
  #chipDate{padding:5px 9px}
  #advisor{max-width:calc(100% - 96px);padding:8px 10px}
  #advisor p{font-size:12px}
  #advisor .av{font-size:22px}
  #inspect{bottom:56px;width:230px}
  #toast{top:96px}
  .tool{width:74px}
}
@media (prefers-reduced-motion:reduce){ .tool{transform:none!important} }

/* ---------- v3.9: phones, landscape and touch ---------- */
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (pointer:coarse){
  .chip{min-height:40px}.iconbtn{width:44px;height:44px}.seg button{min-width:42px;height:40px}
  .tab{padding:10px 16px;min-height:40px}.scrollbtn{width:38px;height:44px}.dockToggle{height:40px}
  #zoomCtl button{width:44px;height:44px}#chipMoney{min-height:40px}
}
/* phones in portrait */
@media (max-width:700px){
  #top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;grid-template-areas:"brand brand money pop mood" "speed date date admin menu";align-items:center;gap:6px;padding:6px 8px}
  .brand{grid-area:brand}#chipMoney{grid-area:money;justify-self:start}#chipPop{grid-area:pop}#chipMood{grid-area:mood}#speed{grid-area:speed;justify-self:start}#chipDate{grid-area:date;display:inline-flex;justify-self:start}
  #btnAdmin{grid-area:admin}#btnMenu{grid-area:menu}.spacer{display:none}#chipDate{max-width:100%;overflow:hidden;white-space:nowrap}
  .seg button{min-width:36px;height:38px}
  #cityName{width:100%;min-width:60px;font-size:16px}
  .chip{padding:4px 9px;font-size:13px}#moneyDelta{display:none}
  #advisor{left:100px;right:10px;max-width:none;padding:6px 10px;cursor:pointer}
  #advisor small{display:none}#advisor.open small{display:block}
  #advisor p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #advisor.open p{display:block;-webkit-line-clamp:unset}
  #paused{top:auto;bottom:62px}
  #dock.open #tools{max-height:34vh}
}
@media (max-width:380px){ #tzAbbr{display:none}.logo{display:none}.chip{padding:3px 7px;font-size:12px}.seg button{min-width:32px}#chipMood{padding:3px 6px} }
/* tablets in portrait: keep the top bar on one row */
@media (min-width:701px) and (max-width:900px){ #dateLong{display:none}#cityName{width:120px} }
/* phones on their side: tools move to a side rail so the map keeps its height */
@media (orientation:landscape) and (max-height:520px){
  body{display:grid;grid-template-columns:minmax(0,1fr) 232px;grid-template-rows:auto minmax(0,1fr)}
  #top{grid-column:1/3;grid-row:1;display:flex;flex-wrap:nowrap;padding:4px 10px;gap:6px}
  #cityName{width:104px;font-size:16px}.chip{padding:3px 9px;font-size:13px;min-height:32px}#dateLong{display:none}#moneyDelta{display:none}
  .seg button{height:34px;min-width:38px}.iconbtn{width:38px;height:38px}
  #stage{grid-column:1;grid-row:2;min-height:0}
  #dock{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-height:0;padding:6px;overflow:hidden;box-shadow:-2px 0 14px rgba(0,0,0,.28)}
  #dock .dockrow:first-child{flex:none}
  #dock .dockrow:last-child{flex:1;min-height:0}
  #tabs{flex-wrap:wrap;overflow:visible;gap:3px;padding-bottom:4px}
  .tab{padding:3px 9px;font-size:12px;min-height:28px}
  .scrollbtn,.scrollbtn.on,.dockToggle{display:none!important}
  #tools{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;overflow-y:auto;overflow-x:hidden;align-content:start;max-height:none;height:100%;padding:2px}
  .tool{width:auto;flex-direction:row;justify-content:flex-start;align-items:center;gap:8px;padding:3px 8px;text-align:left;transform:none!important}
  .tool .icon,.tool .emo{width:34px;height:34px;font-size:22px}
  .tool .nm{min-height:0;justify-content:flex-start;flex:1;font-size:12px}.tool .ct{font-size:11px}
  #advisor{max-width:300px;padding:6px 10px;cursor:pointer}#advisor small{display:none}#advisor.open small{display:block}
  #advisor p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #advisor.open p{display:block;-webkit-line-clamp:unset}
  #zoomCtl{top:auto;bottom:10px;right:10px;transform:none;flex-direction:row;padding:4px}
  #zoomCtl button{width:38px;height:38px}
  #news{left:10px;transform:none;bottom:10px;max-width:calc(100% - 200px);text-align:left}
  #toast{top:56px}#paused{top:auto;bottom:62px}
  #inspect{bottom:60px}
  #gate .gate-logo{display:none}.gate-card{padding:16px 22px}.gate-card h1{font-size:24px;margin-top:0}.gate-sub{margin-bottom:10px}
}
</style>
</head>
<body>

<header id="top" inert>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3 28 10 16 17 4 10Z" fill="#7ed56f"/><path d="M4 10 16 17V30L4 23Z" fill="#2f86d6"/><path d="M28 10 16 17V30L28 23Z" fill="#f4b73f"/>
      <path d="M16 8 21 11 16 14 11 11Z" fill="#fff" opacity=".85"/>
    </svg>
    <input id="cityName" aria-label="City name" maxlength="22" spellcheck="false" value="Sunnybrook">
  </div>
  <div class="chip" id="chipDate" title="World time"><span id="skyIco" aria-hidden="true">☀️</span><span id="dateLong"></span><b id="timeVal">--:--</b><small id="tzAbbr"></small></div>
  <button class="chip money" id="chipMoney" title="Open budget &amp; taxes"><span>$</span><b id="moneyVal">0</b><small id="moneyDelta"></small></button>
  <div class="chip" id="chipPop" title="Population"><span>👥</span><b id="popVal">0</b></div>
  <div class="chip" id="chipMood" title="Happiness"><span id="moodFace">🙂</span><b id="moodVal">50</b></div>
  <div class="spacer"></div>
  <div class="seg" id="speed" role="group" aria-label="Game speed">
    <button data-speed="0" aria-label="Pause" aria-pressed="false">⏸</button>
    <button data-speed="1" aria-label="Normal speed" aria-pressed="true">1×</button>
    <button data-speed="2" aria-label="Fast" aria-pressed="false">2×</button>
    <button data-speed="3" aria-label="Fastest" aria-pressed="false">3×</button>
  </div>
  <button class="iconbtn" id="btnAdmin" aria-label="Admin tools" title="Admin tools">🛠</button>
  <button class="iconbtn" id="btnMenu" aria-label="Menu">☰</button>
</header>

<main id="stage" inert>
  <canvas id="cv" aria-label="Your city. Click or tap to build."></canvas>

  <div class="card" id="demand" title="Demand for new Residential, Commercial and Industrial zones">
    <div class="dcol"><div class="dtrack"><div class="dfill" id="dR" style="background:var(--zr)"></div></div><span style="color:var(--zr)">R</span></div>

  $('#dateLong').textContent=W.wk+' '+W.day+' '+MON[W.month-1];
  $('#tzAbbr').textContent=W.abbr;
  $('#skyIco').textContent=W.rain>.4?'🌧️':W.cloud>.6?'☁️':W.night>.6?'🌙':W.elev<.12?'🌅':'☀️';
  $('#chipDate').title='World time · '+W.tz+(W.warp!==1?' · time lapse ×'+W.warp:'')+' · city age: '+Math.floor(S.day/360)+' y '+Math.floor(S.day/30)%12+' m';
}
function setClockHour(h){ W.lastSample=0; updateSky(0); W.t0Sim+=(h-W.hour)*3.6e6; W.lastSample=0; updateSky(0); }
function resetClock(){ W.t0Real=Date.now(); W.t0Sim=Date.now(); W.warp=1; W.lastSample=0; }
/* demand curves that follow the hour of the day */
function loadFactor(h){ return .7+.35*Math.exp(-((h-19)**2)/12)+.25*Math.exp(-((h-8)**2)/6); }
function trafficFactor(h){ return Math.min(1,.28+.8*Math.exp(-((h-8.5)**2)/5)+.8*Math.exp(-((h-17.5)**2)/6)+.35*Math.exp(-((h-13)**2)/10)); }
function solarNow(){ return Math.max(0,Math.sin(Math.max(0,W.elev)))*(1-.7*W.cloud); }
sampleClock(); W.season=seasonOf(); applySeason(); setWeather(Math.random()<.7?'clear':'cloudy'); W.cloud=W.cloudT; W.nextChange=Date.now()+(3+Math.random()*4)*60000;


/* =====================================================================
   Terrain generation
   ===================================================================== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash2(x,y,s){ let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,2147483647))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function genTerrain(seed){
  const rng = mulberry32(seed);
  const ph=rng()*6.28, base=N*(.3+rng()*.4), amp=3+rng()*3, freq=.1+rng()*.08, horiz=rng()<.5;
  const lx=N*(.15+rng()*.7), ly=N*(.15+rng()*.7), lr=2.5+rng()*3.5;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i=y*N+x, u=horiz?x:y, v=horiz?y:x;
    const c=base+Math.sin(u*freq+ph)*amp+(vnoise(u*.09,seed%97,seed)-.5)*7;
    const w=1.3+vnoise(u*.18,3.3,seed+5)*1.8;
    let water=Math.abs(v-c)<w;
    const d=Math.hypot(x-lx,y-ly)+(vnoise(x*.2,y*.2,seed+9)-.5)*3.5;
    if(d<lr) water=true;
    A.terr[i]=water?1:0;
    A.seed[i]=(rng()*256)|0;
    A.tone[i]=Math.min(2,(vnoise(x*.13,y*.13,seed+31)*3)|0);
  }
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i=y*N+x; if(A.terr[i]) continue;
    const n=vnoise(x*.22,y*.22,seed+21);
    A.tree[i]=((n>.6&&rng()<.7)||rng()<.02)?1:0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<N&&ny<N&&A.terr[ny*N+nx]) A.shore[i]=1; }
  }
  // water depth (distance from land)
  const q=A.queue; let h=0,t=0; A.depth.fill(255);
  for(let i=0;i<NN;i++) if(!A.terr[i]){ A.depth[i]=0; q[t++]=i; }
  while(h<t){ const c=q[h++], cx=c%N, cy=(c/N)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=cx+dx, ny=cy+dy; if(nx<0||ny<0||nx>=N||ny>=N) continue; const j=ny*N+nx;
      if(A.depth[j]===255){ A.depth[j]=A.depth[c]+1; q[t++]=j; } } }
  for(let i=0;i<NN;i++) if(A.terr[i]) A.depth[i]=Math.min(3,Math.max(0,A.depth[i]-1)); else A.depth[i]=0;
}

function newCity(seed){
  allocArrays();
  S.seed = seed || ((Math.random()*1e9)|0);
  genTerrain(S.seed); pickStartLots(); spawnBoats();
  Object.assign(S,{name:NAMES[rint(NAMES.length)],day:0,money:S.sandbox?999999999:20000,tax:9,happy:55,targetHappy:55,hBoost:0,pop:0,jobsC:0,jobsI:0,peak:0,titleIdx:0,hist:[],net:0,flags:{}});
  cars.length=0; parts.length=0; meteors.length=0; tornados.length=0; timers.length=0;
  $('#cityName').value=S.name;
  sel=null; $('#inspect').hidden=true;

}

/* =====================================================================
   Simulation
   ===================================================================== */
const DIRS4 = [[1,0],[0,1],[-1,0],[0,-1]];
const inb = (x,y) => x>=0 && y>=0 && x<N && y<N;
const isService = t => t>=T.POLICE && t<=T.HOSP;

function spreadMax(map,x,y,r,s){
  const r2=r*r;
  for(let dy=-r;dy<=r;dy++){ const yy=y+dy; if(yy<0||yy>=N) continue;
    for(let dx=-r;dx<=r;dx++){ const xx=x+dx; if(xx<0||xx>=N) continue; const d2=dx*dx+dy*dy; if(d2>r2) continue;
      const v=s*(1-Math.sqrt(d2)/r), j=yy*N+xx; if(v>map[j]) map[j]=v; } }
}
function spreadAdd(map,x,y,r,s){
  const r2=r*r;
  for(let dy=-r;dy<=r;dy++){ const yy=y+dy; if(yy<0||yy>=N) continue;
    for(let dx=-r;dx<=r;dx++){ const xx=x+dx; if(xx<0||xx>=N) continue; const d2=dx*dx+dy*dy; if(d2>r2) continue;
      map[yy*N+xx]+=s*(1-Math.sqrt(d2)/r); } }
}

function recompute(){
  const type=A.type, lvl=A.lvl, q=A.queue;
  // 1) road networks
  A.comp.fill(-1); let nc=0;
  for(let i=0;i<NN;i++){
    if(type[i]!==T.ROAD||A.comp[i]>=0) continue;
    let h=0,t=0; q[t++]=i; A.comp[i]=nc;
    while(h<t){ const c=q[h++], cx=c%N, cy=(c/N)|0;
      for(const [dx,dy] of DIRS4){ const nx=cx+dx, ny=cy+dy; if(!inb(nx,ny)) continue; const j=ny*N+nx;
        if(type[j]===T.ROAD&&A.comp[j]<0){ A.comp[j]=nc; q[t++]=j; } } }
    nc++;
  }
  // 2) nearest road (within 2 tiles)
  A.dist.fill(9); A.near.fill(-1);
  let h=0,t=0;
  for(let i=0;i<NN;i++) if(type[i]===T.ROAD){ A.dist[i]=0; A.near[i]=A.comp[i]; q[t++]=i; }
  while(h<t){ const c=q[h++]; if(A.dist[c]>=2) continue; const cx=c%N, cy=(c/N)|0;
    for(const [dx,dy] of DIRS4){ const nx=cx+dx, ny=cy+dy; if(!inb(nx,ny)) continue; const j=ny*N+nx;
      if(A.dist[j]===9&&!(A.terr[j]&&type[j]!==T.ROAD)){ A.dist[j]=A.dist[c]+1; A.near[j]=A.near[c]; q[t++]=j; } } }
  for(let i=0;i<NN;i++) A.access[i]=A.dist[i]<=2?1:0;

  // 3) utilities supply / demand, population
  A.compPw.fill(0); A.compWt.fill(0);
  const solarF=solarNow(), lf=loadFactor(W.hour), wf=.9+(lf-.7)*.57;
  let pwSup=0, wtSup=0, pwDem=0, wtDem=0, pop=0, jC=0, jI=0;
  const cnt=new Array(48).fill(0);
  for(let i=0;i<NN;i++){
    const t=type[i]; if(!t) continue; cnt[t]++;
    const po=PW_OUT[t]; if(po&&A.dist[i]<=1){ A.compPw[A.near[i]]=1; pwSup+=po*(t===T.SOLAR?solarF:1); }
    const wo=WT_OUT[t]; if(wo&&A.dist[i]<=1){ A.compWt[A.near[i]]=1; wtSup+=wo; }
    A.occ[i]=0;
    if(isZone(t)){
      const l=lvl[i], zv=ZV[t][A.zv[i]]||ZV[t][0], f=(.85+A.seed[i]/255*.3)*zv.occ;
      if(l>0&&!A.con[i]){
        if(A.access[i]){ pwDem+=PWU[t][l]*zv.pw; wtDem+=WTU[t][l]*zv.wt; }
        if(t===T.R){ A.occ[i]=Math.round(POP_R[l]*f); pop+=A.occ[i]; }
        else if(t===T.C){ A.occ[i]=Math.round(JOB_C[l]*f); jC+=A.occ[i]; }
        else { A.occ[i]=Math.round(JOB_I[l]*f); jI+=A.occ[i]; }
      }
    } else { pwDem+=PW_USE[t]||0; wtDem+=WT_USE[t]||0; }
  }
  pwDem*=lf; wtDem*=wf;
  S.pwSup=pwSup; S.wtSup=wtSup; S.pwDem=pwDem; S.wtDem=wtDem; S.cnt=cnt;
  S.pwRatio=pwDem>0?Math.min(1,pwSup/pwDem):1;
  S.wtRatio=wtDem>0?Math.min(1,wtSup/wtDem):1;
  if(S.freeUtil){ A.compPw.fill(1); A.compWt.fill(1); S.pwRatio=1; S.wtRatio=1; }
  S.pop=pop; S.jobsC=jC; S.jobsI=jI; if(pop>S.peak) S.peak=pop;
  for(let i=0;i<NN;i++){
    const t=type[i];
    if(!t||t===T.ROAD||t===T.PARK){ A.pw[i]=0; A.wt[i]=0; continue; }
    if(PW_OUT[t]||WT_OUT[t]){ A.pw[i]=1; A.wt[i]=1; continue; }
    if(A.dist[i]<=2){
      const c=A.near[i], sd=A.seed[i];
      A.pw[i]=(A.compPw[c]&&sd<S.pwRatio*255.9)?1:0;
      A.wt[i]=(A.compWt[c]&&sd<S.wtRatio*255.9)?1:0;
    } else { A.pw[i]=0; A.wt[i]=0; }
    if(!isZone(t)){ if(!PW_USE[t]) A.pw[i]=1; if(!WT_USE[t]) A.wt[i]=1; }
  }

  // 4) coverage, pollution, crime, land value
  for(const k of ['cvP','cvF','cvS','cvH','cvK','cvX','cvD','pol']) A[k].fill(0);
  for(let i=0;i<NN;i++){
    const t=type[i], x=i%N, y=(i/N)|0;
    if(A.deco[i]){ spreadAdd(A.cvD,x,y,3,(A.deco[i]===7||A.deco[i]===8)?.5:.3); }
    if(!t) continue;
    const e=(A.pw[i]||t===T.PARK)?1:.4;
    switch(t){
      case T.POLICE: spreadMax(A.cvP,x,y,9,e); break;
      case T.FIRE: spreadMax(A.cvF,x,y,9,e); break;
      case T.SCHOOL: spreadMax(A.cvS,x,y,10,e); break;
      case T.LIBRARY: spreadMax(A.cvS,x,y,8,.7*e); spreadMax(A.cvX,x,y,5,.5*e); break;
      case T.UNIV: spreadMax(A.cvS,x,y,14,e); spreadMax(A.cvX,x,y,6,.6*e); break;
      case T.HOSP: spreadMax(A.cvH,x,y,12,e); break;
      case T.HALL: spreadMax(A.cvX,x,y,12,e); spreadMax(A.cvP,x,y,12,.45*e); break;
      case T.MUSEUM: spreadMax(A.cvX,x,y,8,e); spreadMax(A.cvK,x,y,5,.5); break;
      case T.CHURCH: spreadMax(A.cvK,x,y,5,.55); break;
      case T.STATION: spreadMax(A.cvX,x,y,7,e); break;
      case T.FERRIS: spreadMax(A.cvX,x,y,9,e); spreadMax(A.cvK,x,y,6,.7*e); break;
      case T.LIGHT: spreadMax(A.cvX,x,y,6,e); break;
      case T.PARK: spreadMax(A.cvK,x,y,5,1); break;
      case T.PLAZA: spreadMax(A.cvK,x,y,7,1); spreadMax(A.cvX,x,y,8,1); break;
      case T.STADIUM: spreadMax(A.cvX,x,y,10,e); break;
      case T.HOTEL: spreadMax(A.cvX,x,y,6,e); break;
      case T.MALL: spreadMax(A.cvX,x,y,7,e); break;
      case T.BANK: spreadMax(A.cvX,x,y,5,.5*e); break;
      case T.CINEMA: spreadMax(A.cvX,x,y,5,.5*e); break;
      case T.CAFE: spreadMax(A.cvK,x,y,4,.3); break;
      case T.SPORTS: spreadMax(A.cvX,x,y,6,e); spreadMax(A.cvK,x,y,5,.4*e); break;
      case T.HARBOR: spreadMax(A.cvX,x,y,5,.4*e); break;
      case T.FARM: spreadMax(A.cvK,x,y,4,.3); break;
      case T.POST: spreadMax(A.cvX,x,y,4,.3*e); break;
      case T.DATA: spreadAdd(A.pol,x,y,3,.25); break;
      case T.COAL: spreadAdd(A.pol,x,y,8,1.6); break;
      case T.GAS: spreadAdd(A.pol,x,y,5,.8); break;
      case T.I: if(lvl[i]>0&&!A.con[i]) spreadAdd(A.pol,x,y,5,[0,.55,.85,1.15][lvl[i]]*zvOf(i).pol); break;
      case T.R: if(lvl[i]>0&&!A.con[i]&&A.zv[i]===2) spreadMax(A.cvK,x,y,3,.3); break;
    }
  }
  let sLV=0,sPol=0,sCr=0,sP=0,sF=0,sS=0,sH=0,sK=0,nR=0;
  for(let i=0;i<NN;i++){
    if(A.terr[i]&&type[i]!==T.ROAD){ A.lv[i]=0; continue; }
    const pol=Math.max(0,A.pol[i]-A.cvK[i]*.3); A.pol[i]=pol;
    let v=42+A.cvK[i]*18+A.cvS[i]*8+A.cvP[i]*5+A.cvF[i]*5+A.cvH[i]*6+A.cvX[i]*14+Math.min(10,A.cvD[i]*8)+(A.shore[i]?8:0)-pol*26;
    const cr=clamp(.4+lvl[i]*.07-A.cvP[i]*.6+(50-v)*.004,0,1);
    A.crime[i]=cr; v-=cr*14; A.lv[i]=clamp(v,0,100);
    if(type[i]===T.R&&lvl[i]>0){ nR++; sLV+=A.lv[i]; sPol+=pol; sCr+=cr; sP+=A.cvP[i]; sF+=A.cvF[i]; sS+=A.cvS[i]; sH+=A.cvH[i]; sK+=A.cvK[i]; }
  }
  const av=S.avg;
  if(nR>0){ av.lv=sLV/nR; av.pol=sPol/nR; av.crime=sCr/nR; av.P=sP/nR; av.F=sF/nR; av.S=sS/nR; av.H=sH/nR; av.K=sK/nR; }
  else { av.lv=50; av.pol=0; av.crime=0; av.P=av.F=av.S=av.H=av.K=0; }
  // rent: every building pays the city each month
  for(let i=0;i<NN;i++){
    A.rent[i]=0; const t=type[i], d=A.deco[i]; let base=0;
    if(isZone(t)){ if(lvl[i]>0&&!A.con[i]) base=RENT_Z[t][lvl[i]]*zvOf(i).rent; } else if(t&&t!==T.ROAD) base=RENT[t]||0;
    if(d&&(t===T.NONE||t===T.PARK)) base+=DECO_RENT[d];
    if(base){ const f=.6+A.lv[i]/125, ok=(t===T.NONE||t===T.PARK)||(A.pw[i]&&A.wt[i]); A.rent[i]=base*f*(ok?1:.35); }
  }
  // lots: which are visible (owned or for sale) and where the sale signs stand
  A.sale.fill(0);
  for(let l=0;l<NL;l++){
    const own=A.lot[l]===1, buy=!own&&lotBuyable(l); A.vis[l]=(own||buy||S.allLots)?1:0;
    if(buy&&!S.allLots){ const lx=l%LN, ly=(l/LN)|0; let best=-1, bd=99;
      for(let dy=0;dy<LOT;dy++) for(let dx=0;dx<LOT;dx++){ const i=(ly*LOT+dy)*N+lx*LOT+dx; if(A.terr[i]) continue; const dd=Math.abs(dx-2.5)+Math.abs(dy-2.5); if(dd<bd){ bd=dd; best=i; } }
      if(best>=0) A.sale[best]=1; }
  }
  const workers=pop*.6, jobs=jC+jI;
  av.unemp = workers>0 ? clamp((workers-jobs)/workers,0,.6) : 0;

  // 5) demand
  let dR,dC,dI;
  if(pop<30&&jobs<30){ dR=.6; dC=.2; dI=.3; }
  else {
    dR=Math.max(-.3,(jobs-workers+20)/Math.max(60,jobs+workers)*1.4+.1);
    dC=(pop*.3-jC+8)/Math.max(50,pop*.3)+.1;
    dI=(workers-jobs+10)/Math.max(60,workers)*1.2+.1;
    if(jI>jC*1.5+30) dI-=.3;
  }
  dC+=Math.min(.12,cnt[T.STATION]*.04); dI+=Math.min(.1,cnt[T.UNIV]*.05); dC+=Math.min(.08,cnt[T.UNIV]*.03);
  dC+=Math.min(.12,cnt[T.MALL]*.04+cnt[T.HOTEL]*.02+cnt[T.BANK]*.02); dI+=Math.min(.1,cnt[T.HARBOR]*.05+cnt[T.DATA]*.04);
  const taxFx=(9-S.tax)*.03, mood=(S.happy-55)/250;
  S.dem.r=clamp(dR+taxFx+mood,-1,1); S.dem.c=clamp(dC+taxFx,-1,1); S.dem.i=clamp(dI+taxFx,-1,1);
  if(S.pwRatio<.6||S.wtRatio<.6){ S.dem.r*=.6; }
  if(S.maxDemand){ S.dem.r=1; S.dem.c=1; S.dem.i=1; }

  // 6) happiness target
  if(nR>0){
    const civic=(cnt[T.HALL]?4:0)+Math.min(6,cnt[T.MUSEUM]*1.2+cnt[T.CHURCH]*.5+cnt[T.FERRIS]*1.5+cnt[T.LIGHT]*.5)+Math.min(4,cnt[T.SPORTS]*1+cnt[T.CINEMA]*.8);
    S.targetHappy = clamp(54+(av.lv-45)*.45-Math.max(0,S.tax-9)*1.8+Math.max(0,9-S.tax)*.8-(1-S.pwRatio)*28-(1-S.wtRatio)*28
      -av.pol*22-av.crime*24+av.F*5+av.S*7+av.H*5+av.K*9+av.P*6-av.unemp*30+S.hBoost+civic,0,100);
  } else S.targetHappy=55;
}

function growth(){
  const d=S.dem; let changed=false;
  for(let i=0;i<NN;i++){
    const t=A.type[i]; if(!isZone(t)) continue;
    if(A.con[i]>0){ A.con[i]--; if(!A.con[i]){ changed=true; dust(i%N+.5,((i/N)|0)+.5,10); sfx('ding'); } continue; }
    const l=A.lvl[i], D=S.maxDemand?1:t===T.R?d.r:t===T.C?d.c:d.i;
    if(!A.access[i]){ if(l>0&&Math.random()<.03){ A.lvl[i]=l-1; changed=true; } continue; }
    const ok=A.pw[i]&&A.wt[i];
    if(l===0){
      if(ok&&D>0&&(!zvOf(i).edu||A.cvS[i]>=zvOf(i).edu)&&Math.random()<.05+D*.22){
        A.lvl[i]=1; A.seed[i]=rint(256); A.con[i]=6; A.deco[i]=0; A.tree[i]=0; changed=true;
        if(!S.flags['first'+t]){ S.flags['first'+t]=1; newsMsg(t===T.R?'Builders are on site: the first family moves in soon.':t===T.C?'A shop is going up. The queue is already four people long.':'A factory is under construction. Jobs, jobs, jobs!'); }
      }
    } else {
      let down=false;
      if(!ok) down=Math.random()<.035;
      else if(D<-.5) down=Math.random()<.012;
      else if(S.happy<28&&t===T.R) down=Math.random()<.01;
      else if(A.lv[i]<(t===T.I?28:38)) down=Math.random()<.02;
      if(down){ A.lvl[i]=l-1; changed=true; continue; }
      if(l<3&&ok&&D>.08){
        const need=(t===T.I?(l===1?38:52):(l===1?50:64))+zvOf(i).lvReq;
        if(A.lv[i]>=need&&Math.random()<.012+D*.05){ A.lvl[i]=l+1; A.con[i]=6+2*(l+1); changed=true; }
      }
    }
  }
  if(changed) dirty=true;
}

const FLAMMABLE = new Set([T.R,T.C,T.I,T.PARK,T.SCHOOL,T.HOSP,T.STADIUM]);
function ignite(i){ if(!FLAMMABLE.has(A.type[i])||A.fire[i]) return false; A.fire[i]=1; return true; }
function destroyTile(i,rubble=24){
  const x=i%N,y=(i/N)|0;
  if(A.type[i]){ dust(x+.5,y+.5,14); }
  A.type[i]=0; A.lvl[i]=0; A.con[i]=0; A.fire[i]=0; A.tree[i]=0; A.deco[i]=0; A.rubble[i]=rubble; A.scorch[i]=1; dirty=true;
}
function fireTick(){
  if(S.pop>40&&Math.random()<.004){
    for(let k=0;k<8;k++){ const i=rint(NN), t=A.type[i];
      if(isZone(t)&&A.lvl[i]>0&&Math.random()>A.cvF[i]*.9){ if(ignite(i)){ newsMsg('Fire at a '+TYPE_NAME[t].toLowerCase().replace(' zone','')+'! '+(A.cvF[i]>0.1?'The fire brigade is on it.':'No fire station nearby…')); } break; } }
  }
  for(let i=0;i<NN;i++){
    if(!A.fire[i]) continue;

function budget(){
  const tr=S.tax/100, ex={roads:0,power:0,water:0,safety:0,health:0,parks:0,land:ownedLots()*18}, rent={home:0,biz:0,util:0,civic:0,leisure:0}; let res=0,biz=0,tour=0;
  const tf=.5+.5*Math.min(1,S.pop/2000);
  for(let i=0;i<NN;i++){
    const t=A.type[i];
    if(A.rent[i]>0) rent[rentCat(t)]+=A.rent[i];
    if(!t) continue;
    if(t===T.ROAD) ex.roads+=A.terr[i]?2:UPKEEP[T.ROAD];
    else if(PW_OUT[t]) ex.power+=UPKEEP[t];
    else if(WT_OUT[t]) ex.water+=UPKEEP[t];
    else if(t===T.POLICE||t===T.FIRE) ex.safety+=UPKEEP[t];
    else if(t===T.SCHOOL||t===T.HOSP||t===T.LIBRARY||t===T.UNIV) ex.health+=UPKEEP[t];
    else if(UPKEEP[t]) ex.parks+=UPKEEP[t];
    if(TOURISM[t]&&A.pw[i]) tour+=TOURISM[t]*tf;
    if(t===T.C&&A.zv[i]===2&&A.lvl[i]>0&&!A.con[i]&&A.pw[i]&&A.wt[i]) tour+=[0,35,80,150][A.lvl[i]]*tf;
    if(isZone(t)&&A.lvl[i]>0&&!A.con[i]&&A.pw[i]&&A.wt[i]){
      const f=.6+A.lv[i]/125;
      if(t===T.R) res+=A.occ[i]*42*tr*f; else if(t===T.C) biz+=A.occ[i]*34*tr*f; else biz+=A.occ[i]*40*tr*f;
    }
  }
  const rentTotal=rent.home+rent.biz+rent.util+rent.civic+rent.leisure;
  const expense=ex.roads+ex.power+ex.water+ex.safety+ex.health+ex.parks+ex.land;
  return {res,biz,tour,rent,rentTotal,ex,income:res+biz+tour+rentTotal,expense,net:res+biz+tour+rentTotal-expense};
}

const SILENT = new Set(['Already a road','Already zoned','Tile occupied','Nothing to clear','Already a park','Already placed','Already water','Already land']);
function isFree(i){ const t=A.type[i]; return t===T.NONE||(isZone(t)&&A.lvl[i]===0); }
function costFor(tool,i){ if(S.sandbox) return 0; if(tool.t===T.ROAD&&A.terr[i]) return 45; return tool.cost; }
function isUnlocked(tool){ return S.sandbox||S.unlockAll||S.adminAll||!tool.unlock||S.peak>=tool.unlock; }
function canPlace(tool,x,y){
  if(!inb(x,y)) return 'Out of bounds'; const i=y*N+x, t=A.type[i];
  if(tool.id==='buylot') return '';
  if(!lotOwned(i)) return 'Buy this lot first: select Buy lot in Land & Rivers, or tap the lot with Inspect';
  if(tool.id==='bulldoze') return (t||A.tree[i]||A.rubble[i]||A.scorch[i]||A.deco[i])?'':'Nothing to clear';
  if(!isUnlocked(tool)) return 'Unlocks at '+fmt(tool.unlock)+' residents';
  if(tool.terra==='dig'){ if(A.terr[i]) return 'Already water'; if(t!==T.NONE) return 'Clear the tile first'; return ''; }
  if(tool.terra==='fill'){ if(!A.terr[i]) return 'Already land'; if(t) return 'Remove the bridge first'; return ''; }
  if(tool.deco){ if(A.terr[i]) return 'Not on water'; if(t!==T.NONE&&t!==T.PARK) return 'Tile occupied'; if(A.deco[i]===tool.deco) return 'Already placed'; return ''; }
  if(tool.t===T.ROAD){ if(t===T.ROAD) return 'Already a road'; return isFree(i)?'':'Tile occupied'; }
  if(A.terr[i]) return 'Only roads can cross water';
  if(tool.shore&&!A.shore[i]) return 'Must be on the shoreline';
  if(isZone(tool.t)){ if(t===tool.t&&A.zv[i]===(tool.v||0)) return 'Already zoned'; if(t===T.NONE||isZone(t)) return ''; return 'Tile occupied'; }
  if(tool.t===T.PARK&&t===T.PARK) return 'Already a park';
  return isFree(i)?'':'Tile occupied';
}
function applyTool(tool,x,y){

  }
  const cost=costFor(tool,i);

    terrDirty=true; dirty=true; sfx(tool.terra==='dig'?'splash':'thud'); return '';
  }
  if(tool.deco){ A.deco[i]=tool.deco; A.tree[i]=0; A.rubble[i]=0; A.scorch[i]=0; dirty=true; sfx('park'); return ''; }
  A.type[i]=tool.t; A.zv[i]=tool.v||0; A.lvl[i]=0; A.con[i]=0; A.seed[i]=rint(256); A.tree[i]=0; A.rubble[i]=0; A.scorch[i]=0; A.fire[i]=0; A.deco[i]=0;
  dirty=true;
  if(tool.t!==T.ROAD&&!isZone(tool.t)) dust(x+.5,y+.5,10);
  if(isZone(tool.t)&&!S.flags.zoneHint&&(!S.cnt[T.ROAD]||S.pwSup<=0||S.wtSup<=0)){ S.flags.zoneHint=1; newsMsg('Zones turn into buildings only beside a road (within 2 tiles) that has power and water. Icons on empty zones show what is missing.'); }

   Lots (you must buy land), terraforming and rent

const LOTMAP = new Uint8Array(NN); for(let i=0;i<NN;i++) LOTMAP[i]=Math.floor(Math.floor(i/N)/LOT)*LN+Math.floor((i%N)/LOT);
const lotIdx = i => LOTMAP[i];
const lotOwned = i => S.allLots||A.lot[LOTMAP[i]]===1;
let terrDirty = false;
function lotLand(l){ const lx=l%LN, ly=(l/LN)|0; let n=0; for(let y=ly*LOT;y<ly*LOT+LOT;y++) for(let x=lx*LOT;x<lx*LOT+LOT;x++) if(!A.terr[y*N+x]) n++; return n; }
function ownedLots(){ let n=0; for(let l=0;l<NL;l++) if(A.lot[l]) n++; return n; }
function lotBuyable(l){
  if(A.lot[l]) return false; const lx=l%LN, ly=(l/LN)|0;
  return !!((lx>0&&A.lot[l-1])||(lx<LN-1&&A.lot[l+1])||(ly>0&&A.lot[l-LN])||(ly<LN-1&&A.lot[l+LN]));
}
function lotPrice(l){ const n=ownedLots(), f=.35+.65*lotLand(l)/36; return Math.max(200,Math.round((900+n*n*55+n*280)*f/10)*10); }
function buyLot(x,y){
  const l=lotIdx(y*N+x);
  if(S.allLots){ toast('Every lot is already open. Switch off "Every lot open" in Admin access & tools to buy lots one by one.',5000); return; }
  if(A.lot[l]){ toast('You already own this lot'); return; }
  if(!lotBuyable(l)){ toast('You can only buy lots that touch your land. Look for the FOR SALE signs.',4000); sfx('err'); return; }
  const price=S.sandbox?0:lotPrice(l);
  if(!S.sandbox&&S.money<price){ toast('Not enough $ — this lot costs '+fmt(price),4000); sfx('err'); return; }
  S.money-=price; A.lot[l]=1; dirty=true; sfx('buy');
  const lx=l%LN, ly=(l/LN)|0; for(let k=0;k<8;k++) dust(lx*LOT+Math.random()*LOT,ly*LOT+Math.random()*LOT,3);
  newsMsg('Lot purchased'+(price?' for $'+fmt(price):'')+'. Room to grow!');
}
function pickStartLots(){
  A.lot.fill(0); let best=-1e9, bx=3, by=3;
  for(let ly=1;ly<=5;ly++) for(let lx=1;lx<=5;lx++){
    const sc=lotLand(ly*LN+lx)+lotLand(ly*LN+lx+1)+lotLand((ly+1)*LN+lx)+lotLand((ly+1)*LN+lx+1)-Math.abs(lx-3)*3-Math.abs(ly-3)*3;
    if(sc>best){ best=sc; bx=lx; by=ly; }
  }
  for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]]) A.lot[(by+dy)*LN+bx+dx]=1;
}
/* shore and water depth, rebuilt after digging or filling */
function rebuildWater(){
  A.shore.fill(0);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i=y*N+x; if(A.terr[i]) continue;
    for(const [dx,dy] of DIRS4){ const nx=x+dx, ny=y+dy; if(inb(nx,ny)&&A.terr[ny*N+nx]) A.shore[i]=1; }
  }
  const q=A.queue; let h=0,t=0; A.depth.fill(255);
  for(let i=0;i<NN;i++) if(!A.terr[i]){ A.depth[i]=0; q[t++]=i; }
  while(h<t){ const c=q[h++], cx=c%N, cy=(c/N)|0;
    for(const [dx,dy] of DIRS4){ const nx=cx+dx, ny=cy+dy; if(!inb(nx,ny)) continue; const j=ny*N+nx;
      if(A.depth[j]===255){ A.depth[j]=A.depth[c]+1; q[t++]=j; } } }
  for(let i=0;i<NN;i++){ if(A.terr[i]) A.depth[i]=Math.min(3,Math.max(0,A.depth[i]-1)); else A.depth[i]=0; }
}
function rentCat(t){
  if(t===T.R) return 'home';
  if(t===T.C||t===T.I||t===T.HOTEL||t===T.MALL||t===T.CINEMA||t===T.BANK||t===T.CAFE||t===T.FUEL||t===T.DATA||t===T.FARM||t===T.HARBOR) return 'biz';
  if(PW_OUT[t]||WT_OUT[t]) return 'util';
  if(t===T.NONE||t===T.PARK||t===T.PLAZA||t===T.STADIUM||t===T.MUSEUM||t===T.FERRIS||t===T.LIGHT||t===T.SPORTS) return 'leisure';
  return 'civic';
}

/* ---- pedestrians (visible when zoomed in) ---- */
const peds=[], pedHead=new Int16Array(NN), pedNext=new Int16Array(160);
const PED_COLS=['#c24a4a','#3d7fc4','#d9b23a','#4a9c6a','#7f5bb0','#e8e8e6','#2d3748','#d9772f'];
const flatRoadNeighbors=(x,y)=>roadNeighbors(x,y).filter(d=>!A.terr[(y+DIRS4[d][1])*N+x+DIRS4[d][0]]);
function syncPeds(){
  let roads=0; for(let i=0;i<NN;i++) if(A.type[i]===T.ROAD&&!A.terr[i]) roads++;
  const base=Math.min(120,Math.floor(S.pop/40+roads*.12)), f=(.25+.75*trafficFactor(W.hour))*(1-.7*W.rain), target=Math.floor(base*f);
  while(peds.length>target) peds.pop();
  let guard=0;
  while(peds.length<target&&guard++<40){
    const i=rint(NN); if(A.type[i]!==T.ROAD||A.terr[i]) continue; const x=i%N, y=(i/N)|0, nb=flatRoadNeighbors(x,y); if(!nb.length) continue;
    const d=nb[rint(nb.length)];
    peds.push({ax:x,ay:y,bx:x+DIRS4[d][0],by:y+DIRS4[d][1],d,t:Math.random(),spd:.28+Math.random()*.25,side:Math.random()<.5?1:-1,col:PED_COLS[rint(PED_COLS.length)],x:x+.5,y:y+.5,ph:Math.random()*6});
  }
}
function updatePeds(dt,rate){
  for(let k=peds.length-1;k>=0;k--){
    const c=peds[k];
    if(A.type[c.ay*N+c.ax]!==T.ROAD||A.type[c.by*N+c.bx]!==T.ROAD||A.terr[c.ay*N+c.ax]||A.terr[c.by*N+c.bx]){ peds.splice(k,1); continue; }
    c.t+=c.spd*dt*rate;
    while(c.t>=1){
      c.t-=1; const px=c.ax, py=c.ay; c.ax=c.bx; c.ay=c.by;
      const nb=flatRoadNeighbors(c.ax,c.ay).filter(d=>!(c.ax+DIRS4[d][0]===px&&c.ay+DIRS4[d][1]===py));
      let d;
      if(!nb.length){ const all=flatRoadNeighbors(c.ax,c.ay); if(!all.length){ peds.splice(k,1); break; } d=all[0]; }
      else if(nb.includes(c.d)&&Math.random()<.7) d=c.d; else d=nb[rint(nb.length)];
      c.d=d; c.bx=c.ax+DIRS4[d][0]; c.by=c.ay+DIRS4[d][1];
    }
    const dx=DIRS4[c.d][0], dy=DIRS4[c.d][1];
    c.x=c.ax+.5+dx*c.t-dy*.38*c.side; c.y=c.ay+.5+dy*c.t+dx*.38*c.side;
  }
}

const CAR_COLS=['#b83a3a','#d9b23a','#3d7fc4','#e8e8e6','#3a9c86','#7f5bb0','#d9772f','#2d3748','#8c929a','#1f2630'];
function roadNeighbors(x,y){ const o=[]; for(let d=0;d<4;d++){ const nx=x+DIRS4[d][0], ny=y+DIRS4[d][1]; if(inb(nx,ny)&&A.type[ny*N+nx]===T.ROAD) o.push(d); } return o; }
function syncCars(){
  let roads=0; for(let i=0;i<NN;i++) if(A.type[i]===T.ROAD) roads++;
  const base=Math.min(90,Math.floor(roads*.35+S.pop/30)), target=Math.floor(base*trafficFactor(W.hour));
  while(cars.length>target) cars.pop();
  let guard=0;
  while(cars.length<target&&guard++<40){
    const i=rint(NN); if(A.type[i]!==T.ROAD) continue; const x=i%N,y=(i/N)|0, nb=roadNeighbors(x,y); if(!nb.length) continue;
    const d=nb[rint(nb.length)], r=Math.random(), kind=r<.1?2:r<.26?1:0;
    cars.push({ax:x,ay:y,bx:x+DIRS4[d][0],by:y+DIRS4[d][1],d,t:Math.random(),spd:kind===2?.9:1.1+Math.random()*.9,kind,col:kind===2?'#d9a62e':kind===1?'#e8e8e6':CAR_COLS[rint(CAR_COLS.length)],x:x+.5,y:y+.5});
  }
}
function updateCars(dt,rate){
  for(let k=cars.length-1;k>=0;k--){
    const c=cars[k];
    if(A.type[c.ay*N+c.ax]!==T.ROAD||A.type[c.by*N+c.bx]!==T.ROAD){ cars.splice(k,1); continue; }
    c.t+=c.spd*dt*rate;
    while(c.t>=1){
      c.t-=1; const px=c.ax, py=c.ay; c.ax=c.bx; c.ay=c.by;
      const nb=roadNeighbors(c.ax,c.ay).filter(d=>!(c.ax+DIRS4[d][0]===px&&c.ay+DIRS4[d][1]===py));
      let d;
      if(!nb.length){ const all=roadNeighbors(c.ax,c.ay); if(!all.length){ cars.splice(k,1); break; } d=all[0]; }
      else if(nb.includes(c.d)&&Math.random()<.65) d=c.d; else d=nb[rint(nb.length)];
      c.d=d; c.bx=c.ax+DIRS4[d][0]; c.by=c.ay+DIRS4[d][1];
    }
    const dx=DIRS4[c.d][0], dy=DIRS4[c.d][1];
    c.x=c.ax+.5+dx*c.t+dy*.14; c.y=c.ay+.5+dy*c.t-dx*.14;
  }
}
/* boats sail on rivers and lakes */
const boatHead=new Int16Array(NN), boatNext=new Int16Array(64);
function spawnBoats(){
  boats.length=0; const water=[];
  for(let i=0;i<NN;i++) if(A.terr[i]&&A.depth[i]>=1) water.push(i);
  const n=Math.min(7,Math.floor(water.length/45));
  for(let k=0;k<n;k++){ const i=water[rint(water.length)]; boats.push({x:i%N+.5,y:((i/N)|0)+.5,a:Math.random()*6.28,sp:.22+Math.random()*.22,kind:rint(3)}); }
}
function updateBoats(dt,rate){
  for(const b of boats){
    if(!A.terr[Math.floor(b.y)*N+Math.floor(b.x)]){ for(let tr=0;tr<40;tr++){ const wi=rint(NN); if(A.terr[wi]){ b.x=wi%N+.5; b.y=((wi/N)|0)+.5; break; } } continue; }
    const ax=b.x+Math.cos(b.a)*.75, ay=b.y+Math.sin(b.a)*.75, ix=Math.floor(ax), iy=Math.floor(ay);
    if(inb(ix,iy)&&A.terr[iy*N+ix]){ b.x+=Math.cos(b.a)*b.sp*dt*rate; b.y+=Math.sin(b.a)*b.sp*dt*rate; b.a+=(Math.random()-.5)*dt*.5; }
    else b.a+=(Math.random()<.5?1:-1)*(1.2+Math.random())*Math.min(.3,dt*6);
    b.x=clamp(b.x,.2,N-.2); b.y=clamp(b.y,.2,N-.2);
  }
}
/* birds and clouds drift over the map in world space */
function initAmbient(){
  birds.length=0; clouds.length=0;
  for(let k=0;k<3;k++) birds.push({x:-1500+Math.random()*3000,y:300+Math.random()*900,vx:(Math.random()<.5?-1:1)*(14+Math.random()*14),vy:(Math.random()-.5)*4,n:4+rint(4),ph:Math.random()*6});
  for(let k=0;k<6;k++) clouds.push({x:-1700+Math.random()*3400,y:100+Math.random()*1300,s:.8+Math.random()*1.3,vx:5+Math.random()*9});
  spawnBoats();
}
function updateAmbient(dt){
  for(const b of birds){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.ph+=dt*9; if(b.x>1800) b.x=-1800; if(b.x<-1800) b.x=1800; }
  for(const c of clouds){ c.x+=c.vx*dt; if(c.x>1900){ c.x=-1900; c.y=100+Math.random()*1300; } }
}

const cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage');
let g=ctx, dpr=1, VW=800, VH=600;
const cam={x:0,y:0,z:.85};
const X=(fx,fy)=>(fx-fy)*HW;
const Y=(fx,fy,h)=>(fx+fy)*HH-(h||0);

/* =====================================================================
   Realism (High graphics): textured seamless ground, moving water with
   sky reflections and sun glitter, sun-driven lighting
   ===================================================================== */
let HQ=true, LQL=0, LQR=0, texGrass=null, texWater=null, texGlint=null, lowFps=0;
const GFX_KEY='pocketopolis.gfx';
function setGfx(v,save){ S.gfx=v; HQ=v==='high'; if(save){ try{ localStorage.setItem(GFX_KEY,v); }catch(e){} } }
function loadGfx(){ try{ const v=localStorage.getItem(GFX_KEY); if(v==='high'||v==='standard') S.gfx=v; }catch(e){} HQ=S.gfx==='high'; }
function makeTextures(){
  const wrap=(w,h,x,y,fn)=>{ for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++) fn(x+ox*w,y+oy*h); };
  const mk=(w,h,draw)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return ctx.createPattern(c,'repeat'); };
  texGrass=mk(160,160,(k,w,h)=>{
    for(let n=0;n<28;n++){
      const x=Math.random()*w, y=Math.random()*h, r=14+Math.random()*34, col=Math.random()<.5?'rgba(18,48,10,.08)':'rgba(205,238,125,.07)';
      wrap(w,h,x,y,(px,py)=>{ const gr=k.createRadialGradient(px,py,0,px,py,r); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)'); k.fillStyle=gr; k.fillRect(px-r,py-r,r*2,r*2); });
    }
    k.lineWidth=1;
    for(let n=0;n<720;n++){
      const x=Math.random()*w, y=Math.random()*h, l=2+Math.random()*3.5, jx=(Math.random()-.5)*2; k.strokeStyle=Math.random()<.5?'rgba(25,60,15,.24)':'rgba(208,238,132,.2)';
      wrap(w,h,x,y,(px,py)=>{ k.beginPath(); k.moveTo(px,py); k.lineTo(px+jx,py-l); k.stroke(); });
    }
  });
  texWater=mk(192,192,(k,w,h)=>{
    k.lineCap='round';
    for(let n=0;n<150;n++){
      const x=Math.random()*w, y=Math.random()*h, l=10+Math.random()*22, bend=2+Math.random()*3; k.lineWidth=1+Math.random()*1.2; k.strokeStyle=Math.random()<.45?'rgba(8,48,88,.17)':'rgba(255,255,255,.17)';
      wrap(w,h,x,y,(px,py)=>{ k.beginPath(); k.moveTo(px-l/2,py); k.quadraticCurveTo(px,py-bend,px+l/2,py); k.stroke(); });
    }
  });
  texGlint=mk(128,128,(k,w,h)=>{
    for(let n=0;n<110;n++){
      const x=Math.random()*w, y=Math.random()*h, r=.5+Math.random()*1.0;
      wrap(w,h,x,y,(px,py)=>{ k.fillStyle='rgba(255,255,255,.85)'; k.beginPath(); k.arc(px,py,r,0,6.2832); k.fill(); });
    }
  });
}
function pathTiles(list){
  g.beginPath();
  for(let k=0;k<list.length;k+=2){ const x=list[k], y=list[k+1]; g.moveTo(X(x,y),Y(x,y)); g.lineTo(X(x+1,y),Y(x+1,y)); g.lineTo(X(x+1,y+1),Y(x+1,y+1)); g.lineTo(X(x,y+1),Y(x,y+1)); g.closePath(); }
}
function fillTiles(list,col){ if(!list.length) return; g.fillStyle=col; pathTiles(list); g.fill(); }
/* all natural ground and water is drawn as big merged shapes: no tile seams, one texture across the whole land */
function drawTerrainBatch(visit){
  if(!texGrass) makeTextures();
  const lw=[[],[],[],[]], lg=[[],[],[]], ls=[], land=[], water=[], all=[];
  visit((x,y,i)=>{
    all.push(x,y);
    if(A.terr[i]){ lw[A.depth[i]].push(x,y); water.push(x,y); return; }
    const t=A.type[i];
    if((t===T.NONE&&!A.rubble[i])||(isZone(t)&&A.lvl[i]===0)){ (t===T.NONE&&A.shore[i]?ls:lg[A.tone[i]]).push(x,y); land.push(x,y); }
  });
  fillTiles(all,'#3d5634');
  for(let d=0;d<4;d++) fillTiles(lw[d],P.water[d]);
  for(let k=0;k<3;k++) fillTiles(lg[k],P.grass[k]);
  fillTiles(ls,P.sand);
  if(land.length){ pathTiles(land); g.fillStyle=texGrass; g.fill(); }
  if(water.length){
    pathTiles(water); g.save(); g.clip();
    const hz=mixC(skyColors(W.elev*180/Math.PI)[1],[170,182,196],W.cloud*.5), bx=CULL.x0-220, by=CULL.y0-220, bw=CULL.x1-CULL.x0+440, bh=CULL.y1-CULL.y0+440;
    g.fillStyle='rgba('+(hz[0]|0)+','+(hz[1]|0)+','+(hz[2]|0)+','+(.22*(1-W.night*.7))+')'; g.fillRect(bx,by,bw,bh);
    g.fillStyle=texWater;
    g.save(); g.translate((time*7)%192,(time*2.5)%192); g.fillRect(bx-192,by-192,bw+384,bh+384); g.restore();
    g.save(); g.translate(192-(time*4.5)%192,(time*5.5)%192); g.fillRect(bx-192,by-192,bw+384,bh+384); g.restore();
    const gl=.6*W.dayF*(1-.85*W.cloud);
    if(gl>.04){ g.globalAlpha=gl; g.fillStyle=texGlint; g.save(); g.translate((time*3)%128,(time*1.5)%128); g.fillRect(bx-128,by-128,bw+256,bh+256); g.restore(); g.globalAlpha=1; }
    g.restore();
  }
}

const palCache=new Map();
function pal(hex){
  const key=hex+'|'+LQL+'|'+LQR; let p=palCache.get(key);
  if(!p){ const n=parseInt(hex.slice(1),16), r=n>>16, gg=(n>>8)&255, b=n&255;
    const f=k=>'rgb('+Math.min(255,(r*k)|0)+','+Math.min(255,(gg*k)|0)+','+Math.min(255,(b*k)|0)+')';
    p={t:f(1.1),l:f(.93+LQL*.055),r:f(.72+LQR*.06)}; palCache.set(key,p); }
  return p;
}
function gq(x0,y0,x1,y1,col,h,stroke){
  h=h||0; g.fillStyle=col; g.beginPath();
  g.moveTo(X(x0,y0),Y(x0,y0,h)); g.lineTo(X(x1,y0),Y(x1,y0,h)); g.lineTo(X(x1,y1),Y(x1,y1,h)); g.lineTo(X(x0,y1),Y(x0,y1,h)); g.closePath(); g.fill();
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=1; g.stroke(); }
}
function box(x0,y0,x1,y1,h0,h1,p,noTop){
  const xl=X(x0,y1), xb=X(x1,y1), xr=X(x1,y0), xt=X(x0,y0);
  g.fillStyle=p.l; g.beginPath(); g.moveTo(xl,Y(x0,y1,h0)); g.lineTo(xb,Y(x1,y1,h0)); g.lineTo(xb,Y(x1,y1,h1)); g.lineTo(xl,Y(x0,y1,h1)); g.closePath(); g.fill();
  g.fillStyle=p.r; g.beginPath(); g.moveTo(xb,Y(x1,y1,h0)); g.lineTo(xr,Y(x1,y0,h0)); g.lineTo(xr,Y(x1,y0,h1)); g.lineTo(xb,Y(x1,y1,h1)); g.closePath(); g.fill();
  if(!noTop){ g.fillStyle=p.t; g.beginPath(); g.moveTo(xt,Y(x0,y0,h1)); g.lineTo(xr,Y(x1,y0,h1)); g.lineTo(xb,Y(x1,y1,h1)); g.lineTo(xl,Y(x0,y1,h1)); g.closePath(); g.fill(); }
  if(HQ&&LOD&&(h1-h0)>=8){
    if(h0<1.5){ const ao=Math.min(5,(h1-h0)*.2); g.fillStyle='rgba(0,0,0,.16)';
      g.beginPath(); g.moveTo(xl,Y(x0,y1,h0)); g.lineTo(xb,Y(x1,y1,h0)); g.lineTo(xb,Y(x1,y1,h0+ao)); g.lineTo(xl,Y(x0,y1,h0+ao)); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(xb,Y(x1,y1,h0)); g.lineTo(xr,Y(x1,y0,h0)); g.lineTo(xr,Y(x1,y0,h0+ao)); g.lineTo(xb,Y(x1,y1,h0+ao)); g.closePath(); g.fill(); }
    g.lineWidth=.7; g.strokeStyle='rgba(0,0,0,.2)'; g.beginPath(); g.moveTo(xb,Y(x1,y1,h0)); g.lineTo(xb,Y(x1,y1,h1)); g.stroke();
    if(!noTop){ g.strokeStyle='rgba(255,255,255,.24)'; g.beginPath(); g.moveTo(xl,Y(x0,y1,h1)); g.lineTo(xb,Y(x1,y1,h1)); g.lineTo(xr,Y(x1,y0,h1)); g.stroke(); }
  }
}
function hip(x0,y0,x1,y1,h,rh,p){
  const cx=(x0+x1)/2, cy=(y0+y1)/2, ax=X(cx,cy), ay=Y(cx,cy,h+rh);
  g.fillStyle=p.l; g.beginPath(); g.moveTo(X(x0,y1),Y(x0,y1,h)); g.lineTo(X(x1,y1),Y(x1,y1,h)); g.lineTo(ax,ay); g.closePath(); g.fill();
  g.fillStyle=p.r; g.beginPath(); g.moveTo(X(x1,y1),Y(x1,y1,h)); g.lineTo(X(x1,y0),Y(x1,y0,h)); g.lineTo(ax,ay); g.closePath(); g.fill();
  if(HQ&&LOD&&cam.z>=.8){
    const e0=X(x0,y1), f0=Y(x0,y1,h), e1=X(x1,y1), f1=Y(x1,y1,h), e2=X(x1,y0), f2=Y(x1,y0,h);
    g.strokeStyle='rgba(0,0,0,.13)'; g.lineWidth=.6; g.beginPath();
    for(const t of [.3,.55,.8]){ g.moveTo(e0+(ax-e0)*t,f0+(ay-f0)*t); g.lineTo(e1+(ax-e1)*t,f1+(ay-f1)*t); g.lineTo(e2+(ax-e2)*t,f2+(ay-f2)*t); }
    g.stroke();
  }
}
function cyl(cx,cy,r0,r1,h0,h1,cl,cr,ct){
  const x=X(cx,cy), yb=Y(cx,cy,h0), yt=Y(cx,cy,h1), a0=r0*45.25, b0=r0*22.6, a1=r1*45.25, b1=r1*22.6;
  g.fillStyle=cl; g.beginPath(); g.moveTo(x-a0,yb); g.ellipse(x,yb,a0,b0,0,Math.PI,Math.PI/2,true); g.lineTo(x,yt); g.lineTo(x-a1,yt); g.closePath(); g.fill();
  g.fillStyle=cr; g.beginPath(); g.moveTo(x+a0,yb); g.ellipse(x,yb,a0,b0,0,0,Math.PI/2); g.lineTo(x,yt); g.lineTo(x+a1,yt); g.closePath(); g.fill();
  g.fillStyle=ct; g.beginPath(); g.ellipse(x,yt,a1,b1,0,0,6.2832); g.fill();
}
function faceL(x0,x1,y,v0,v1,col){ g.fillStyle=col; g.beginPath(); g.moveTo(X(x0,y),Y(x0,y,v0)); g.lineTo(X(x1,y),Y(x1,y,v0)); g.lineTo(X(x1,y),Y(x1,y,v1)); g.lineTo(X(x0,y),Y(x0,y,v1)); g.closePath(); g.fill(); }
function faceR(y0,y1,x,v0,v1,col){ g.fillStyle=col; g.beginPath(); g.moveTo(X(x,y0),Y(x,y0,v0)); g.lineTo(X(x,y1),Y(x,y1,v0)); g.lineTo(X(x,y1),Y(x,y1,v1)); g.lineTo(X(x,y0),Y(x,y0,v1)); g.closePath(); g.fill(); }
function disc(x,y,r,col){ g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill(); }
function shadowAt(fx,fy,rx,ry){ g.fillStyle='rgba(0,20,10,.16)'; g.beginPath(); g.ellipse(X(fx,fy),Y(fx,fy,0),rx,ry,0,0,6.2832); g.fill(); }

/* ---- windows + night lights ---- */
let winL='rgba(214,236,255,.92)', winR='rgba(150,190,226,.92)', night=0, LOD=true, live=false;
const lightBuf=new Float32Array(8*7000); let lightN=0;
const glowBuf=new Float32Array(2*1200); let glowN=0;
function pushQuad(a,b,c,d,e,f,gg,h){ if(lightN+8>lightBuf.length) return; const L=lightBuf; L[lightN++]=a;L[lightN++]=b;L[lightN++]=c;L[lightN++]=d;L[lightN++]=e;L[lightN++]=f;L[lightN++]=gg;L[lightN++]=h; }
function wins(x0,y0,x1,y1,h0,h1,cols,rows,s,lit){
  if(!LOD) return;
  const dx=(x1-x0)/cols, dy=(y1-y0)/cols, hh=(h1-h0)/rows, nl=lit&&night>.1;
  g.fillStyle=winL; g.beginPath();
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const a0=x0+(c+.2)*dx, a1=x0+(c+.8)*dx, v0=h0+(r+.3)*hh, v1=h0+(r+.78)*hh;
    const p0=X(a0,y1), p1=X(a1,y1), q0=Y(a0,y1,v0), q1=Y(a1,y1,v0), q2=Y(a1,y1,v1), q3=Y(a0,y1,v1);
    g.moveTo(p0,q0); g.lineTo(p1,q1); g.lineTo(p1,q2); g.lineTo(p0,q3); g.closePath();
    if(nl&&((s*31+r*17+c*7)%11)<6) pushQuad(p0,q0,p1,q1,p1,q2,p0,q3);
  }
  g.fill();
  g.fillStyle=winR; g.beginPath();
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const b0=y0+(c+.2)*dy, b1=y0+(c+.8)*dy, v0=h0+(r+.3)*hh, v1=h0+(r+.78)*hh;
    const p0=X(x1,b0), p1=X(x1,b1), q0=Y(x1,b0,v0), q1=Y(x1,b1,v0), q2=Y(x1,b1,v1), q3=Y(x1,b0,v1);
    g.moveTo(p0,q0); g.lineTo(p1,q1); g.lineTo(p1,q2); g.lineTo(p0,q3); g.closePath();
    if(nl&&((s*19+r*13+c*5+3)%11)<5) pushQuad(p0,q0,p1,q1,p1,q2,p0,q3);
  }
  g.fill();
}
function smokeAt(fx,fy,h,rate){ if(live&&Math.random()<dtG*rate*(S.speed?1:.2)){ puff(X(fx,fy)+(Math.random()-.5)*3,Y(fx,fy,h),{vx:6+Math.random()*8,vy:-16-Math.random()*8,life:2.4,max:2.4,size:2.5,grow:4.5,alpha:.26}); } }

/* ---- trees (season aware) ---- */
const TREE_SPOTS=[[.25,.3],[.7,.25],[.2,.75],[.45,.58],[.75,.7]];
function tree(fx,fy,s,k,size){
  const x=X(fx,fy), y=Y(fx,fy,0), gc=P.tree[(s+k)%3]; size=size||1;
  g.fillStyle='rgba(0,20,10,.10)'; g.beginPath(); g.ellipse(x,y+1,6*size,2.8*size,0,0,6.2832); g.fill();
  if(((s>>k)&3)===0){ // conifer
    g.fillStyle='#5b4130'; g.fillRect(x-1,y-5*size,2,5*size);
    for(let j=0;j<3;j++){ g.fillStyle=j%2?P.pine[1]:P.pine[0]; g.beginPath(); const by=y-4*size-j*5*size, w=(8-j*2)*size; g.moveTo(x-w,by); g.lineTo(x+w,by); g.lineTo(x,by-9*size); g.closePath(); g.fill(); }
  } else {
    g.fillStyle='#5b4130'; g.fillRect(x-1.2,y-6*size,2.4,6*size);
    disc(x,y-11*size,7*size,gc[0]); if(HQ) disc(x+2.4*size,y-9.2*size,4.6*size,'rgba(0,28,10,.22)'); disc(x-2*size,y-13*size,4.6*size,gc[1]); disc(x+3*size,y-10*size,3.4*size,gc[1]); if(HQ&&LOD) disc(x-3*size,y-15*size,1.6*size,'rgba(255,255,230,.18)');
  }
}
function drawTrees(x,y,s,n){
  for(let k=0;k<5;k++){ if(k<(n||2)||((s>>k)&1)) tree(x+TREE_SPOTS[k][0],y+TREE_SPOTS[k][1],s,k,.9+((s>>(k+1))&1)*.2); }
}
function oak(fx,fy,size,s){
  const x=X(fx,fy), y=Y(fx,fy,0), c=P.tree[s%3];
  g.fillStyle='rgba(0,20,10,.12)'; g.beginPath(); g.ellipse(x,y+1,9*size,4*size,0,0,6.2832); g.fill();
  g.fillStyle='#5b4130'; g.fillRect(x-2.2*size,y-10*size,4.4*size,10*size);
  disc(x-5*size,y-15*size,7.5*size,c[0]); disc(x+5*size,y-15*size,7*size,c[0]); disc(x,y-20*size,9*size,c[0]);
  if(HQ) disc(x+3.5*size,y-14*size,7.5*size,'rgba(0,28,10,.2)');
  disc(x-2*size,y-22*size,5.5*size,c[1]); disc(x+4*size,y-18*size,4*size,c[1]);
}

/* =====================================================================
   Sound: cute synthesized effects, soft nature ambience and a gentle
   music-box tune. Everything is generated in the browser (no files).

let ac=null, master=null, sfxBus=null, musBus=null, ambBus=null, reverb=null, noiseBuf=null, rainGain=null;
let musTimer=0, musNext=0, musIdx=2, musBeat=0, ambTimer=0, nextChirp=0, nextCricket=0, nextThunder=0, zoneStep=0;
const lastSfx={}, AUD_KEY='pocketopolis.audio', VOLS=[.3,.6,1], VOLN=['Low','Medium','High'];
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
function loadAudio(){ try{ const v=JSON.parse(localStorage.getItem(AUD_KEY)||'null'); if(v){ if(typeof v.sound==='boolean') S.sound=v.sound; if(typeof v.music==='boolean') S.music=v.music; if(v.vol===0||v.vol===1||v.vol===2) S.vol=v.vol; } }catch(e){} }

function applyAudio(){ if(master) master.gain.value=VOLS[S.vol]; }
function ensureAudio(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    try{ ac=new AC(); }catch(e){ ac=null; return false; }
    master=ac.createGain(); master.gain.value=VOLS[S.vol]; master.connect(ac.destination);
    sfxBus=ac.createGain(); sfxBus.connect(master);
    musBus=ac.createGain(); musBus.gain.value=.55; musBus.connect(master);
    ambBus=ac.createGain(); ambBus.gain.value=.7; ambBus.connect(master);
    reverb=ac.createConvolver(); const len=Math.floor(ac.sampleRate*1.4), ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
    reverb.buffer=ir; const wet=ac.createGain(); wet.gain.value=.3; reverb.connect(wet); wet.connect(master);
    musBus.connect(reverb); sfxBus.connect(reverb);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended'&&!document.hidden){ try{ ac.resume(); }catch(e){} }
  if(!musTimer){ musNext=ac.currentTime+.5; musTimer=setInterval(musTick,120); }
  if(!ambTimer){ ambTimer=setInterval(ambTick,1000); }

}
/* ---- building blocks ---- */
function tone(f0,f1,dur,type,vol,delay,bus){
  const t=ac.currentTime+(delay||0), o=ac.createOscillator(), gn=ac.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  gn.gain.setValueAtTime(.0001,t); gn.gain.linearRampToValueAtTime(vol,t+.008); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn); gn.connect(bus||sfxBus); o.start(t); o.stop(t+dur+.03);
}
function pluck(f,delay,vol,bus,dur){ dur=dur||.5; tone(f,f,dur,'sine',vol,delay,bus); tone(f*2,f*2,dur*.5,'sine',vol*.3,delay,bus); tone(f*3.01,f*3.01,dur*.25,'sine',vol*.12,delay,bus); }
function bell(f,delay,vol){ tone(f,f,.9,'sine',vol,delay); tone(f*2.76,f*2.76,.5,'sine',vol*.25,delay); tone(f*5.4,f*5.4,.25,'sine',vol*.1,delay); }
function noise(dur,vol,freq,q,delay,type,bus){
  const t=ac.currentTime+(delay||0), src=ac.createBufferSource(), f=ac.createBiquadFilter(), gn=ac.createGain();
  src.buffer=noiseBuf; src.loop=true; f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  gn.gain.setValueAtTime(.0001,t); gn.gain.linearRampToValueAtTime(vol,t+.01); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(gn); gn.connect(bus||sfxBus); src.start(t); src.stop(t+dur+.05);
}
/* ---- effects ---- */
const SFX_GAP={road:70,zone:35,ding:90,tap:40,select:40,tab:40};
function sfx(k){
  if(!S.sound) return; if(!ensureAudio()) return;
  const now=performance.now(), gap=SFX_GAP[k]===undefined?35:SFX_GAP[k], prev=lastSfx[k]; if(prev&&now-prev<gap) return; lastSfx[k]=now;
  if(k==='zone'&&(!prev||now-prev>700)) zoneStep=0;
  try{ playSfx(k); }catch(e){}
}
function buildSoundFor(tool){
  if(tool.t===T.ROAD) return 'road'; if(isZone(tool.t)) return 'zone'; if(tool.deco||tool.t===T.PARK) return 'park';
  if(PW_OUT[tool.t]||WT_OUT[tool.t]) return 'util';
  if(tool.t===T.POLICE||tool.t===T.FIRE||tool.t===T.HOSP||tool.t===T.SCHOOL) return 'service';
  if(tool.cat==='civic'||tool.cat==='fun') return 'civic'; return 'build';
}
function playSfx(k){
  switch(k){
    case 'tap': tone(880,1100,.05,'sine',.05); break;
    case 'select': tone(520,780,.08,'sine',.07); break;
    case 'tab': tone(640,640,.04,'triangle',.05); break;
    case 'open': pluck(659.25,0,.07); pluck(880,.07,.06); break;
    case 'road': tone(300+Math.random()*40,340,.05,'triangle',.045); break;
    case 'zone': pluck(PENTA[zoneStep++%8],0,.075,sfxBus,.35); break;
    case 'build': tone(380,720,.12,'sine',.1); tone(720,1080,.1,'sine',.06,.06); break;
    case 'util': tone(500,500,.06,'triangle',.07); tone(750,750,.06,'triangle',.07,.07); tone(1000,1000,.1,'triangle',.06,.14); break;
    case 'service': bell(880,0,.08); break;
    case 'park': pluck(784,0,.08); tone(1800,2400,.08,'sine',.04,.1); tone(2400,1900,.08,'sine',.04,.17); break;
    case 'civic': pluck(523.25,0,.08); pluck(659.25,.08,.08); pluck(783.99,.16,.08); pluck(1046.5,.24,.1); break;
    case 'bull': tone(300,90,.18,'triangle',.09); noise(.14,.05,900,.8); break;
    case 'splash': tone(300,520,.09,'sine',.07); tone(420,760,.09,'sine',.06,.07); tone(560,980,.1,'sine',.05,.14); noise(.2,.05,2600,.7); break;
    case 'thud': tone(150,70,.14,'sine',.1); noise(.08,.03,500,.8); break;
    case 'err': tone(392,330,.12,'sine',.07); tone(330,262,.18,'sine',.07,.11); break;
    case 'ding': pluck(PENTA[(Math.random()*6)|0]*(Math.random()<.3?2:1),0,.05,sfxBus,.7); break;
    case 'up': pluck(523.25,0,.09); pluck(659.25,.1,.09); pluck(783.99,.2,.09); pluck(1046.5,.3,.11); bell(2093,.42,.04); break;
    case 'buy': bell(784,0,.08); bell(988,.09,.08); bell(1175,.18,.08); bell(1568,.27,.07); break;
    case 'coin': bell(1318.5,0,.06); bell(1760,.08,.06); break;
    case 'fw': tone(400,1600,.3,'sine',.05); noise(.25,.08,3000,.6,.3); tone(900,300,.3,'sine',.05,.3); break;
    case 'boom': tone(110,35,.6,'triangle',.14); noise(.5,.1,220,.8,0,'lowpass'); break;
    case 'hoot': tone(340,290,.2,'sine',.1); tone(340,285,.26,'sine',.1,.26); break;
  }
}
/* ---- nature ambience: birds by day, crickets at night, rain and distant thunder ---- */
function chirp(){ const base=2000+Math.random()*1400; for(let k=0,n=2+((Math.random()*3)|0);k<n;k++) tone(base,base*(1.2+Math.random()*.3),.07,'sine',.028,k*.11,ambBus); }
function crickets(){ for(let b=0;b<2;b++) for(let k=0;k<7;k++) tone(4300,4300,.025,'sine',.012,b*.5+k*.045,ambBus); }
function thunder(){ noise(2.4,.1,170,.7,0,'lowpass',ambBus); noise(1.2,.06,90,.7,.3,'lowpass',ambBus); }
function ensureRain(){
  if(rainGain) return;
  const src=ac.createBufferSource(), f=ac.createBiquadFilter(); rainGain=ac.createGain(); rainGain.gain.value=0;
  src.buffer=noiseBuf; src.loop=true; f.type='bandpass'; f.frequency.value=2200; f.Q.value=.5; src.connect(f); f.connect(rainGain); rainGain.connect(ambBus); src.start();
}
function ambTick(){
  try{
    if(!ac||document.hidden) return;
    if(!S.sound){ if(rainGain) rainGain.gain.setTargetAtTime(0,ac.currentTime,.3); return; }
    const now=ac.currentTime; ensureRain(); rainGain.gain.setTargetAtTime(Math.min(.12,W.rain*.12),now,.8);
    if(W.dayF>.3&&W.rain<.3&&now>=nextChirp){ chirp(); nextChirp=now+5+Math.random()*9; }
    if(W.night>.5&&W.rain<.3&&now>=nextCricket){ crickets(); nextCricket=now+3+Math.random()*5; }
    if(W.rain>.8&&now>=nextThunder){ thunder(); nextThunder=now+25+Math.random()*40; }
  }catch(e){}
}
/* ---- music: a soft generative music-box tune (major by day, softer minor at night) ---- */
function musTick(){
  try{
    if(!ac) return;
    if(!S.music||document.hidden||ac.state!=='running'){ musNext=Math.max(musNext,ac.currentTime+.2); return; }
    const night=W.night>.5, beat=60/(night?62:84)/2, scale=night?[220,261.63,293.66,329.63,392,440]:[261.63,293.66,329.63,392,440,523.25];
    while(musNext<ac.currentTime+.5){
      const d=musNext-ac.currentTime;
      if(musBeat%8===0) tone(scale[0]/2,scale[0]/2,1.6,'sine',.05,d,musBus);
      if(Math.random()>.2){ musIdx=clamp(musIdx+((Math.random()<.5?-1:1)*(Math.random()<.7?1:2)),0,5); pluck(scale[musIdx]*(Math.random()<.2?2:1),d,.03,musBus,.9); }
      musNext+=beat; musBeat++;

  }catch(e){}
}

const ptrs=new Map(); let drag=null, pinch=null, lastTile=null;
const localPt=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
function bresenham(x0,y0,x1,y1,fn){
  let dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx+dy;
  for(let k=0;k<200;k++){ fn(x0,y0); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){ err+=dy; x0+=sx; } if(e2<=dx){ err+=dx; y0+=sy; } }
}
function paintTo(tt){
  if(!tt) return; const tool=TOOL_BY_ID[S.tool]; let reason='';
  const one=(x,y)=>{ const r=applyTool(tool,x,y); if(r) reason=r; };
  if(lastTile&&(lastTile.x!==tt.x||lastTile.y!==tt.y)) bresenham(lastTile.x,lastTile.y,tt.x,tt.y,one); else one(tt.x,tt.y);
  lastTile=tt;
  if(reason&&!SILENT.has(reason)){ toast(reason); if(reason.indexOf('Not enough')===0) sfx('err'); }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}

cv.addEventListener('pointermove',e=>{
  const p=localPt(e), prev=ptrs.get(e.pointerId);

  { let free=0; for(let i=0;i<NN;i++) if(A.type[i]===T.NONE&&!A.terr[i]&&lotOwned(i)&&A.dist[i]<=2) free++; if(free<18&&S.pop>40) return 'You are running out of room. Open Land & Rivers and buy a lot next to your land.'; }

const QUOTES={

    if(UPKEEP[t]&&t!==T.ROAD) rows.push(['Upkeep','$'+UPKEEP[t]+'/mo']);
    rows.push(['Land value',Math.round(A.lv[i])]);
    if(isZone(t)&&A.lvl[i]){ rows.push(['Crime',['Low','Medium','High'][Math.min(2,Math.floor(A.crime[i]*3))]]); rows.push(['Pollution',['None','Some','Heavy'][A.pol[i]<.1?0:A.pol[i]<.45?1:2]]); }
    if(A.fire[i]) rows.unshift(['Status','On fire! 🔥']);
    if(t===T.R&&A.lvl[i]){ q=!A.pw[i]?pick(QUOTES.dark):!A.wt[i]?pick(QUOTES.dry):A.crime[i]>.5?pick(QUOTES.crime):A.pol[i]>.4?pick(QUOTES.smog):pick(QUOTES.good); }

  const key=sel.x+','+sel.y+','+t+','+A.lvl[i]+','+(A.pw[i]&&A.wt[i]);

  el.querySelector('h3').textContent=title;

/* ---- scrollable, adjustable tool dock ---- */
const DOCK_KEY='pocketopolis.dock';
function updateDockScroll(){
  for(const id of ['tabs','tools']){
    const el=$('#'+id); if(!el) continue; const over=!(S.dockOpen&&(id==='tools'||innerWidth>700))&&el.scrollWidth>el.clientWidth+2;
    document.querySelectorAll('.scrollbtn[data-scroll="'+id+'"]').forEach(b=>{
      b.classList.toggle('on',over); b.disabled=b.dataset.dir==='-1'?el.scrollLeft<=1:el.scrollLeft>=el.scrollWidth-el.clientWidth-1; });
  }
}
function centerActiveTab(){
  const nav=$('#tabs'), sel=nav&&nav.querySelector('[aria-selected="true"]'); if(!sel||(S.dockOpen&&innerWidth>700)) return;
  nav.scrollLeft=Math.max(0,sel.offsetLeft-(nav.clientWidth-sel.offsetWidth)/2);
}
function setDockOpen(on,save){
  S.dockOpen=!!on; $('#dock').classList.toggle('open',S.dockOpen);
  const b=$('#dockToggle'); if(b){ b.setAttribute('aria-expanded',String(S.dockOpen)); b.textContent=S.dockOpen?'Collapse ▾':'All tools ▴'; }
  if(save){ try{ localStorage.setItem(DOCK_KEY,S.dockOpen?'1':'0'); }catch(e){} }
  updateDockScroll(); setTimeout(()=>{ updateDockScroll(); if(typeof resize==='function'&&0) resize(); },60);
}
function setupDock(){
  for(const id of ['tabs','tools']){
    const el=$('#'+id); let down=null;
    el.addEventListener('wheel',e=>{ if(S.dockOpen||el.scrollWidth<=el.clientWidth) return; if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ el.scrollLeft+=e.deltaY; e.preventDefault(); updateDockScroll(); } },{passive:false});
    el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button===0) down={x:e.clientX,left:el.scrollLeft,moved:false}; });
    el.addEventListener('pointermove',e=>{ if(!down||S.dockOpen) return; const dx=e.clientX-down.x; if(Math.abs(dx)>6) down.moved=true; if(down.moved){ el.scrollLeft=down.left-dx; updateDockScroll(); } });
    const end=()=>{ if(down&&down.moved) el._dragAt=Date.now(); down=null; };
    el.addEventListener('pointerup',end); el.addEventListener('pointerleave',end); el.addEventListener('pointercancel',end);
    el.addEventListener('click',e=>{ if(el._dragAt&&Date.now()-el._dragAt<120){ e.stopImmediatePropagation(); e.preventDefault(); } },true);
    el.addEventListener('scroll',updateDockScroll,{passive:true});
  }
  document.querySelectorAll('.scrollbtn').forEach(b=>b.addEventListener('click',()=>{
    const el=$('#'+b.dataset.scroll); const dx=(+b.dataset.dir)*Math.max(120,el.clientWidth*.7);
    if(el.scrollBy) el.scrollBy({left:dx,behavior:'smooth'}); else el.scrollLeft+=dx; setTimeout(updateDockScroll,320); }));
  $('#dockToggle').addEventListener('click',()=>setDockOpen(!S.dockOpen,true));
  window.addEventListener('resize',updateDockScroll);
  if(window.ResizeObserver) new ResizeObserver(updateDockScroll).observe($('#dock'));
  let saved=null; try{ saved=localStorage.getItem(DOCK_KEY); }catch(e){}
  setDockOpen(saved==='1',false);
}

/* =====================================================================
   Admin gate
   Note: this is a client-side passcode check for a testing build. It keeps
   casual visitors out, but it cannot stop someone who reads the page source.
   Keep the page link private for real access control.
   ===================================================================== */
const SHA_K=(()=>{ const k=[]; let n=2; while(k.length<64){ let p=true; for(let d=2;d*d<=n;d++) if(n%d===0){ p=false; break; } if(p) k.push(Math.floor((Math.cbrt(n)%1)*4294967296)); n++; } return k; })();

function sha256hex(str){
  const msg=new TextEncoder().encode(str), l=msg.length, nb=((l+9+63)>>6)<<6, buf=new Uint8Array(nb); buf.set(msg); buf[l]=0x80;
  const dv=new DataView(buf.buffer); dv.setUint32(nb-4,(l*8)>>>0); dv.setUint32(nb-8,Math.floor(l*8/4294967296));
  const h=SHA_H.slice(), w=new Int32Array(64);
  for(let o=0;o<nb;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const a=w[i-15], b=w[i-2];
      const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3), s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let a=h[0]|0,b=h[1]|0,c=h[2]|0,d=h[3]|0,e=h[4]|0,f=h[5]|0,gg=h[6]|0,hh=h[7]|0;
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)), ch=(e&f)^(~e&gg), t1=(hh+S1+ch+SHA_K[i]+w[i])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      hh=gg; gg=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0; h[1]=(h[1]+b)|0; h[2]=(h[2]+c)|0; h[3]=(h[3]+d)|0; h[4]=(h[4]+e)|0; h[5]=(h[5]+f)|0; h[6]=(h[6]+gg)|0; h[7]=(h[7]+hh)|0;
  }
  return Array.from(h,v=>(v>>>0).toString(16).padStart(8,'0')).join('');

const AUTH={salt:'1b57cab765a0d261d23d6515',iters:4000,hash:'96d4feece52e4220f8e2e28d8f5ba5f83ab7750a16fa9d46658f87444d78d8a4'};
const SESSION_KEY='pocketopolis.admin.session';
function authHash(p){ let h=sha256hex(AUTH.salt+':'+p); for(let i=0;i<AUTH.iters;i++) h=sha256hex(h+':'+AUTH.salt); return h; }
let gateFails=0, gateLockUntil=0, started=false;
function gateTry(){
  const msg=$('#gateMsg'), inp=$('#gatePass'), btn=$('#gateBtn'), now=Date.now();
  if(now<gateLockUntil){ msg.textContent='Too many attempts. Try again in '+Math.ceil((gateLockUntil-now)/1000)+' seconds.'; return; }
  btn.disabled=true; msg.textContent='Checking…';
  setTimeout(()=>{
    const ok=authHash(inp.value.trim())===AUTH.hash; btn.disabled=false;
    if(ok){ inp.value=''; msg.textContent=''; try{ sessionStorage.setItem(SESSION_KEY,AUTH.hash.slice(0,24)); }catch(e){} startGame(); }
    else {

      if(gateFails>=5){ gateLockUntil=Date.now()+30000*Math.min(gateFails-4,6); msg.textContent='Too many attempts. Locked for '+Math.round((gateLockUntil-Date.now())/1000)+' seconds.'; }
